name: Backend checks
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: porfin_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: porfin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U porfin_test -d porfin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://porfin_test:local-ci-only@localhost:5432/porfin_test?schema=public
      DIRECT_URL: postgresql://porfin_test:local-ci-only@localhost:5432/porfin_test?schema=public
      ALLOWED_ORIGINS: http://localhost:3000
      API_ORIGIN: http://localhost:3001
      MAIL_MODE: file
      SWAGGER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev --no-audit
      - run: npm run prisma:deploy
      - run: npm run prisma:seed
      - run: npm run check